[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-entity-eval"
version = "0.1.0"
description = "Entity-aware splitting, data-leakage auditing, ICC effective sample size diagnostics, and unit-level statistical evaluation for federated learning in intelligent driving."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5"]

[tool.setuptools.packages.find]
include = ["fl_entity_eval*"]
